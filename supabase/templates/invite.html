<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
  </head>
  <body
    style="
      margin: 0;
      background: #f5f5f2;
      font-family: Manrope, Inter, Arial, sans-serif;
      color: #111111;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f5f5f2"
    >
      <tr>
        <td align="center" style="padding: 36px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 620px"
          >
            <tr>
              <td
                style="
                  border: 1px solid #111111;
                  border-bottom: 0;
                  border-radius: 28px 28px 0 0;
                  background: #f8b9e7;
                  padding: 28px 34px;
                "
              >
                <img
                  src="https://www.fideleo.store/logo.svg"
                  width="168"
                  height="38"
                  alt="Fideleo"
                  style="display: block; width: 168px; height: auto; border: 0"
                />
              </td>
            </tr>
            <tr>
              <td
                style="
                  border: 1px solid #111111;
                  border-radius: 0 0 28px 28px;
                  background: #ffffff;
                  padding: 38px 34px;
                "
              >
                <p
                  style="
                    margin: 0 0 14px;
                    font-size: 12px;
                    font-weight: 800;
                    letter-spacing: 0.14em;
                    text-transform: uppercase;
                  "
                >
                  Invitación
                </p>
                <h1
                  style="margin: 0 0 24px; font-size: 32px; line-height: 1.15; letter-spacing: -1px"
                >
                  Te han invitado a Fideleo
                </h1>
                <p style="margin: 0 0 16px; color: #363636; font-size: 16px; line-height: 1.65">
                  Acepta la invitación para crear tu cuenta y acceder al panel.
                </p>

                <div style="margin: 28px 0">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      border-radius: 999px;
                      background: #111111;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 700;
                      font-size: 15px;
                      padding: 15px 25px;
                    "
                    >Aceptar invitación</a
                  >
                </div>
                <p
                  style="
                    margin: 24px 0 0;
                    border-radius: 16px;
                    background: #dff7ff;
                    padding: 16px;
                    color: #3e3e3e;
                    font-size: 13px;
                    line-height: 1.55;
                  "
                >
                  Si no esperabas esta invitación, puedes ignorar este mensaje.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 6px 0; color: #6c6c6c; font-size: 12px; line-height: 1.5">
                © 2026 Fideleo · Este es un correo transaccional.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
